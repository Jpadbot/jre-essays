<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRE範文.beta</title>
<meta name="description" content="JRE 考試風格中英範文：手機優先閱讀，先列表後全文，可調字體與背景。">
<style>
:root {
  --font-scale: 1;
  --bg: #f7f6f3;
  --card: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --line: #e8e6e1;
  --accent: #0b6e4f;
  --accent-soft: #e6f3ee;
  --prompt-bg: #f0efeb;
  --shadow: 0 1px 2px rgba(26,26,26,.04), 0 8px 24px rgba(26,26,26,.04);
  --radius: 18px;
  --tap: 44px;
  --reader-max: 40rem;
  --masthead: #0b6e4f;
  --overlay: rgba(26,26,26,.28);
  --fab-bg: #1a1a1a;
  --fab-ink: #fff;
  --panel-bg: #ffffff;
  --card-en: #eef7f4;
  --card-zh: #faf6f0;
  --card-en-border: #cfe8df;
  --card-zh-border: #eadfce;
  --body-en-bg: #f3faf7;
  --body-zh-bg: #fbf7f1;
}

[data-theme="dark"] {
  --bg: #0d0d0d;
  --card: #1a1a1a;
  --ink: #f0f0f0;
  --muted: #9a9a9a;
  --line: #2a2a2a;
  --accent: #5ecf9a;
  --accent-soft: #143528;
  --prompt-bg: #141414;
  --shadow: none;
  --masthead: #5ecf9a;
  --overlay: rgba(0,0,0,.55);
  --fab-bg: #f0f0f0;
  --fab-ink: #0d0d0d;
  --panel-bg: #1f1f1f;
  --card-en: #14241e;
  --card-zh: #241c16;
  --card-en-border: #1e3a30;
  --card-zh-border: #3a2e24;
  --body-en-bg: #101c18;
  --body-zh-bg: #1a1511;
}

[data-theme="warm"] {
  --bg: #f4ebe0;
  --card: #fff9f2;
  --ink: #3a2c24;
  --muted: #8a7264;
  --line: #e5d5c4;
  --accent: #b45309;
  --accent-soft: #f5e6d4;
  --prompt-bg: #f7efe6;
  --shadow: 0 1px 3px rgba(58,44,36,.06);
  --masthead: #b45309;
  --overlay: rgba(58,44,36,.28);
  --fab-bg: #3a2c24;
  --fab-ink: #fff9f2;
  --panel-bg: #fff9f2;
  --card-en: #e8f2ec;
  --card-zh: #f8efe4;
  --card-en-border: #c5ddd0;
  --card-zh-border: #e5d3bc;
  --body-en-bg: #eef6f1;
  --body-zh-bg: #faf3ea;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans CNS",
    "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  font-size: calc(16px * var(--font-scale));
}
body {
  min-height: 100dvh;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
}
a { color: var(--accent); text-decoration: none; }
.wrap { max-width: var(--reader-max); margin: 0 auto; padding: 20px 18px 32px; }

/* —— Masthead —— */
.masthead {
  margin: 0 0 28px;
  padding: 4px 0 22px;
  border-bottom: 2px solid var(--ink);
}
.masthead h1 {
  margin: 0; font-size: 1.75rem; line-height: 1.25;
  font-weight: 800; letter-spacing: -.02em;
}

/* —— Feed cards —— */
.feed-label {
  font-size: .72rem; font-weight: 800; letter-spacing: .1em;
  color: var(--muted); margin: 0 0 14px; text-transform: uppercase;
}
.card {
  display: block; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 20px 18px; margin: 0 0 16px;
  box-shadow: var(--shadow); color: inherit;
  transition: border-color .15s, transform .15s;
}
.card.lang-en {
  background: var(--card-en); border-color: var(--card-en-border);
}
.card.lang-zh {
  background: var(--card-zh); border-color: var(--card-zh-border);
}
.card:hover { border-color: var(--accent); }
.card:active { transform: scale(.995); }
.card-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: .75rem; color: var(--muted); font-weight: 600;
  margin-bottom: 10px;
}
.card-meta time { letter-spacing: .02em; }
.badge {
  background: var(--accent-soft); color: var(--accent); font-weight: 800;
  padding: 3px 9px; border-radius: 999px; font-size: .7rem;
  letter-spacing: .02em;
}
.card h2 {
  margin: 0 0 10px; font-size: 1.2rem; line-height: 1.35;
  font-weight: 800; letter-spacing: -.01em;
}
.card .excerpt {
  margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .read-more {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 14px; font-size: .85rem; font-weight: 800; color: var(--accent);
}
.card .read-more::after { content: "→"; }

/* —— Article —— */
.back {
  min-height: var(--tap); padding: 8px 2px; margin: 0 0 6px;
  border: none; background: transparent; color: var(--accent);
  font: inherit; font-weight: 800; cursor: pointer;
}
.article-head {
  margin-bottom: 22px; padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
}
.article-head h1 {
  margin: 10px 0 0; font-size: 1.55rem; line-height: 1.3;
  font-weight: 800; letter-spacing: -.02em;
}
.article-head .sub { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
.wordcount {
  display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin: 14px 0 0; padding: 8px 14px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 12px; font-size: .95rem; font-weight: 800;
  letter-spacing: .01em; line-height: 1.35;
}
.article-head.lang-en { border-bottom-color: var(--card-en-border); }
.article-head.lang-zh { border-bottom-color: var(--card-zh-border); }

.block {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 18px; margin: 0 0 16px;
  box-shadow: var(--shadow);
}
.block.prompt.lang-en { background: var(--card-en); border-color: var(--card-en-border); }
.block.prompt.lang-zh { background: var(--card-zh); border-color: var(--card-zh-border); }
.block.body.lang-en {
  background: var(--body-en-bg); border-color: var(--card-en-border);
}
.block.body.lang-zh,
.block.translation {
  background: var(--body-zh-bg); border-color: var(--card-zh-border);
}
/* Headings: never justify (avoids "rivers" on narrow screens) */
.block h1, .block h2, .block h3,
.article-head h1, .card h2, .masthead h1 {
  text-align: left;
  -webkit-hyphens: none;
  hyphens: none;
}
.block h2 {
  margin: 0 0 14px; font-size: .78rem; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.block.prompt { background: var(--prompt-bg); }
.block h3 { margin: 1.25em 0 .5em; font-size: 1.05rem; font-weight: 800; }
.block h3:first-of-type { margin-top: .35em; }
.block p { margin: 0 0 1em; }
.block p:last-child { margin-bottom: 0; }

/* English body: left-align on narrow screens; justify only when wide enough */
.block.body.lang-en p {
  text-align: left;
}
@media (min-width: 640px) {
  .block.body.lang-en p {
    text-align: justify;
    -webkit-hyphens: auto;
    hyphens: auto;
    hyphenate-limit-chars: 6 3 3;
  }
}
.meta-line { color: var(--muted); font-size: .9rem; margin-bottom: 1.1em !important; }
.zh-note { color: var(--muted); font-size: .9rem; }


/* —— Category tabs —— */
.cat-tabs {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 0 0 18px; padding: 0;
  list-style: none;
}
.cat-tab {
  min-height: 40px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink);
  font: inherit; font-size: .85rem; font-weight: 800;
  cursor: pointer; letter-spacing: .01em;
}
.cat-tab[aria-selected="true"] {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.cat-tab .count {
  display: inline-block; margin-left: 6px;
  font-size: .72rem; font-weight: 700; opacity: .85;
}
.feed-section-label {
  font-size: .72rem; font-weight: 800; letter-spacing: .1em;
  color: var(--muted); margin: 4px 0 14px; text-transform: uppercase;
}
.card.lang-tips {
  background: var(--card); border-color: var(--line);
  border-left: 4px solid var(--accent);
}
.article-head.lang-tips { border-bottom-color: var(--accent); }
.block.prompt.lang-tips,
.block.body.lang-tips {
  background: var(--card); border-color: var(--line);
}

footer.site {
  margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .75rem; text-align: center;
}

/* —— FAB + panel —— */
#settings-fab {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  z-index: 50;
  width: 52px; height: 52px; border-radius: 50%;
  border: none; cursor: pointer;
  background: var(--fab-bg); color: var(--fab-ink);
  font: inherit; font-size: 1.05rem; font-weight: 800;
  letter-spacing: -.02em;
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, opacity .15s;
}
#settings-fab:active { transform: scale(.94); }
#settings-fab[aria-expanded="true"] { opacity: .0; pointer-events: none; }

#settings-overlay {
  position: fixed; inset: 0; z-index: 45;
  background: var(--overlay);
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
#settings-overlay.is-open { opacity: 1; pointer-events: auto; }

#settings-panel {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 55;
  max-width: 22rem; margin: 0 auto;
  background: var(--panel-bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 20px;
  padding: 14px 14px 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
  transform: translateY(110%);
  opacity: 0; pointer-events: none;
  transition: transform .22s ease, opacity .18s ease;
}
#settings-panel.is-open {
  transform: translateY(0); opacity: 1; pointer-events: auto;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding: 0 2px;
}
.panel-head strong { font-size: .85rem; font-weight: 800; }
.panel-close {
  min-width: 36px; min-height: 36px; border: none; border-radius: 50%;
  background: var(--prompt-bg); color: var(--ink);
  font: inherit; font-size: 1.1rem; cursor: pointer; line-height: 1;
}
.panel-row {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-bottom: 10px;
}
.panel-row:last-child { margin-bottom: 2px; }
.panel-label {
  width: 100%; font-size: .72rem; font-weight: 700;
  color: var(--muted); letter-spacing: .04em; margin-bottom: 2px;
}
#settings-panel button.ctrl {
  min-width: 44px; min-height: 40px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer;
}
#settings-panel button.ctrl.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
#font-label {
  min-width: 48px; text-align: center; font-size: .85rem;
  font-weight: 800; color: var(--muted);
}

@media (min-width: 640px) {
  .masthead h1 { font-size: 2rem; }
  .card h2 { font-size: 1.28rem; }
  .article-head h1 { font-size: 1.75rem; }
}
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead" id="site-masthead">
      <h1>JRE範文.beta</h1>
    </header>

    <div id="feed-chrome">
      <p class="feed-label" id="feed-label">分類瀏覽</p>
      <div class="cat-tabs" role="tablist" aria-label="文章分類" id="cat-tabs">
        <button type="button" class="cat-tab" role="tab" data-cat="en" aria-selected="false">英文範文<span class="count" data-count-for="en"></span></button>
        <button type="button" class="cat-tab" role="tab" data-cat="zh" aria-selected="false">中文範文<span class="count" data-count-for="zh"></span></button>
        <button type="button" class="cat-tab" role="tab" data-cat="tips" aria-selected="false">心得與常見錯誤<span class="count" data-count-for="tips"></span></button>
      </div>
      <p class="feed-section-label" id="feed-section-label"></p>
    </div>
    <main id="feed" aria-label="文章列表"></main>
    <article id="article" hidden aria-label="文章全文"></article>

    <footer class="site">JRE範文.beta · 靜態託管 · 閱讀偏好僅存於瀏覽器</footer>
  </div>

  <button type="button" id="settings-fab" aria-label="開啟閱讀設定" aria-expanded="false" aria-controls="settings-panel">Aa</button>
  <div id="settings-overlay" hidden></div>
  <div id="settings-panel" role="dialog" aria-label="閱讀設定" aria-modal="true" hidden>
    <div class="panel-head">
      <strong>閱讀設定</strong>
      <button type="button" class="panel-close" id="btn-panel-close" aria-label="關閉設定">×</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">字體大小</span>
      <button type="button" class="ctrl" id="btn-a-minus" aria-label="縮小字體">A−</button>
      <span id="font-label">100%</span>
      <button type="button" class="ctrl" id="btn-a-plus" aria-label="放大字體">A＋</button>
      <button type="button" class="ctrl" id="btn-font-reset" aria-label="重設字體">重設</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">背景</span>
      <button type="button" class="ctrl" data-theme-btn="light" aria-label="淺色背景">淺色</button>
      <button type="button" class="ctrl" data-theme-btn="dark" aria-label="深色背景">深色</button>
      <button type="button" class="ctrl" data-theme-btn="warm" aria-label="暖色背景">暖色</button>
    </div>
  </div>

  <script src="essays-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
