<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRE 範文站</title>
<meta name="description" content="JRE 考試風格中英範文：手機優先閱讀，先列表後全文，可調字體與背景。">
<style>
:root {
  --font-scale: 1;
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #0f1419;
  --muted: #536471;
  --line: #eff3f4;
  --accent: #1d9bf0;
  --accent-soft: #e8f5fd;
  --prompt-bg: #f7f9f9;
  --settings-bg: rgba(255,255,255,.94);
  --settings-ink: #0f1419;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
  --radius: 16px;
  --tap: 44px;
  --reader-max: 42rem;
}
[data-theme="dark"] {
  --bg: #000000;
  --card: #16181c;
  --ink: #e7e9ea;
  --muted: #8b98a5;
  --line: #2f3336;
  --accent: #1d9bf0;
  --accent-soft: #031825;
  --prompt-bg: #1e2126;
  --settings-bg: rgba(22,24,28,.96);
  --settings-ink: #e7e9ea;
  --shadow: none;
}
[data-theme="warm"] {
  --bg: #f3ebe1;
  --card: #fff8f0;
  --ink: #3b2f2a;
  --muted: #7a6558;
  --line: #e8d9c8;
  --accent: #c45c26;
  --accent-soft: #f5e4d6;
  --prompt-bg: #f7efe6;
  --settings-bg: rgba(255,248,240,.96);
  --settings-ink: #3b2f2a;
  --shadow: 0 1px 3px rgba(59,47,42,.06);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans CNS",
    "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  font-size: calc(16px * var(--font-scale));
}
body { min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
a { color: var(--accent); text-decoration: none; }
.wrap { max-width: var(--reader-max); margin: 0 auto; padding: 16px 16px 24px; }
header.site { padding: 8px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header.site .eyebrow {
  display: inline-block; font-size: .72rem; font-weight: 700;
  letter-spacing: .06em; color: var(--accent); background: var(--accent-soft);
  padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
}
header.site h1 { margin: 0; font-size: 1.35rem; line-height: 1.3; letter-spacing: .01em; }
header.site p { margin: 8px 0 0; color: var(--muted); font-size: .92rem; }

.card {
  display: block; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 16px 14px; margin: 0 0 12px;
  box-shadow: var(--shadow); color: inherit; transition: border-color .15s;
}
.card:active, .card:hover { border-color: var(--accent); }
.card h2 { margin: 6px 0 8px; font-size: 1.08rem; line-height: 1.35; font-weight: 800; }
.card .excerpt { margin: 0; color: var(--muted); font-size: .92rem; display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .read-more { display: inline-block; margin-top: 10px; font-size: .85rem;
  font-weight: 700; color: var(--accent); }
.card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: .78rem; color: var(--muted); }
.badge {
  background: var(--accent-soft); color: var(--accent); font-weight: 700;
  padding: 2px 8px; border-radius: 999px; font-size: .72rem;
}

.back {
  min-height: var(--tap); padding: 8px 4px; margin: 0 0 8px;
  border: none; background: transparent; color: var(--accent);
  font: inherit; font-weight: 700; cursor: pointer;
}
.article-head { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.article-head h1 { margin: 8px 0 0; font-size: 1.35rem; line-height: 1.35; }
.article-head .sub { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }

.block {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin: 0 0 14px; box-shadow: var(--shadow);
}
.block h2 {
  margin: 0 0 12px; font-size: 1rem; color: var(--accent);
  letter-spacing: .02em;
}
.block.prompt { background: var(--prompt-bg); }
.block h3 { margin: 1.1em 0 .45em; font-size: 1.02rem; }
.block p { margin: 0 0 .85em; }
.block p:last-child { margin-bottom: 0; }
.meta-line { color: var(--muted); font-size: .9rem; margin-bottom: 1em !important; }
.zh-note { color: var(--muted); font-size: .9rem; }

#settings {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center; pointer-events: none;
  padding: 0 10px calc(10px + env(safe-area-inset-bottom));
  transition: opacity .25s, transform .25s;
}
#settings.is-hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
#settings:not(.is-hidden) { opacity: 1; transform: none; }
.settings-inner {
  pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  justify-content: center; max-width: 100%;
  background: var(--settings-bg); color: var(--settings-ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 10px; box-shadow: 0 8px 28px rgba(0,0,0,.12);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.settings-inner button {
  min-width: 40px; min-height: 40px; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink); font: inherit; font-weight: 700;
  cursor: pointer;
}
.settings-inner button.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
#font-label {
  min-width: 48px; text-align: center; font-size: .85rem; font-weight: 700;
  color: var(--muted);
}
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
footer.site {
  margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .78rem; text-align: center;
}
</style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <span class="eyebrow">012 · JRE 範文站</span>
      <h1>每日範文閱讀</h1>
      <p>列表只顯示標題與摘要；點開才見全文。可調字體與背景，偏好會記住。</p>
    </header>

    <main id="feed" aria-label="文章列表"></main>
    <article id="article" hidden aria-label="文章全文"></article>

    <footer class="site">靜態託管 · 本地偏好存於瀏覽器</footer>
  </div>

  <div id="settings" role="toolbar" aria-label="閱讀設定">
    <div class="settings-inner">
      <button type="button" id="btn-a-minus" aria-label="縮小字體">A−</button>
      <span id="font-label">100%</span>
      <button type="button" id="btn-a-plus" aria-label="放大字體">A＋</button>
      <button type="button" id="btn-font-reset" aria-label="重設字體">重設</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-theme-btn="light" aria-label="淺色背景">淺色</button>
      <button type="button" data-theme-btn="dark" aria-label="深色背景">深色</button>
      <button type="button" data-theme-btn="warm" aria-label="暖色背景">暖色</button>
    </div>
  </div>

  <script src="essays-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
